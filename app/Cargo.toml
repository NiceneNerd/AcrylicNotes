[package]
name = "app"
version = "0.1.0"
edition = "2021"
description = "Vault Notes — libcosmic GUI (M4)"

[dependencies]
vault-core = { path = "../vault-core" }
vault-md = { path = "../vault-md" }
# Used from M4c on (glass backdrop); kept listed so the dependency stays honest.
vault-glass = { path = "../vault-glass" }
dirs = "6.0"
chrono = "0.4"
# Same version cosmic-theme uses (0.7.7 in the lock) — for Srgba conversions.
palette = "0.7"
# Quick-switcher fuzzy matching (the helix editor's engine).
nucleo = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# libcosmic (and its vendored iced submodule) come from git so the build does
# not depend on a local checkout. Pinned libcosmic commit:
# 95236a944bfd51c63a2fc65fe50a592c47168d40 (2026-10-27).
# libcosmic vendors iced (pop-os/iced.git submodule commit
# 229186b5180b6217d93866c912e6373ac378b231) via `path = "./iced"`. Because
# that vendored iced is a path source while a direct `iced` git dependency
# would be a separate crate instance, features no longer unify across them.
# `app` uses `cosmic::iced::*` exclusively, so it drops its direct `iced`
# dependency and enables the features it needs on libcosmic instead.
#
# NOTE: libcosmic's vendored iced is built with `image-without-codecs` and
# libcosmic exposes no `iced/image` feature, so image *decoding* for
# `cosmic::iced::widget::image` is not available at this pinned commit.
[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
rev = "95236a944bfd51c63a2fc65fe50a592c47168d40"
default-features = false
features = ["wgpu", "tokio", "a11y", "highlighter"]

# Per-target feature selection (see HANDOFF.md 4.1): Wayland on Linux,
# winit everywhere else. `cargo tree --target <triple> -e features` shows the
# result.
[target.'cfg(target_os = "linux")'.dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
rev = "95236a944bfd51c63a2fc65fe50a592c47168d40"
default-features = false
features = ["wayland", "dbus-config", "highlighter"]

[target.'cfg(not(target_os = "linux"))'.dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
rev = "95236a944bfd51c63a2fc65fe50a592c47168d40"
default-features = false
features = ["winit", "highlighter"]

[dev-dependencies]
tempfile = "3.22"
