[package]
name = "vault-app"
version = "0.1.0"
edition = "2021"
description = "GUI-free application kernel: shared state, commands, effects, and view models"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
vault-core = { path = "../../vault-core" }
vault-md = { path = "../../vault-md" }
vault-platform = { path = "../vault-platform" }
# Quick-switcher fuzzy matching (the helix editor's engine).
nucleo = "0.5"
# The same word segmentation cosmic-text uses, so the shared editor's
# word motion finds the same word boundaries the live editor's own
# motions find.
unicode-segmentation = "1"

[dev-dependencies]
tempfile = "3"
serde_json = "1.0"
