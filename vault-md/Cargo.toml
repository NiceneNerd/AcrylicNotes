[package]
name = "vault-md"
version = "0.1.0"
edition = "2021"
description = "Markdown pipeline: comrak parse + Obsidian extensions -> IR -> HTML/widgets"

[dependencies]
# comrak 0.59: extension gates are selected per-parse via Options; the cargo
# features only cover extras. `attributes` enables `{#id}` heading attributes.
comrak = { version = "0.59", default-features = false, features = ["attributes"] }
vault-core = { path = "../vault-core" }
ammonia = "4.2"
thiserror = "2.0"
