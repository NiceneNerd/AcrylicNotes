[package]
name = "vault-md"
version = "0.1.0"
edition = "2021"
description = "Markdown pipeline: comrak parse + Obsidian extensions -> IR -> HTML/widgets"

[dependencies]
# comrak 0.59: extension gates (tables, footnotes, math, ofm_*) are compile-time
# OFF by default and selected per-parse via Options; the cargo features only
# cover the CLI/syntect extras, which we do not want.
comrak = { version = "0.59", default-features = false }
vault-core = { path = "../vault-core" }
thiserror = "2.0"
