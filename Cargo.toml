[workspace]
resolver = "2"
members = [
    "crates/vault-app",
    "crates/vault-platform",
    "vault-glass",
    "vault-core",
    "vault-md",
    "app",
    "vault-web",
]
# `app` depends on libcosmic + iced from git repos (pinned revs in
# app/Cargo.toml), so the default commands build/test the UI-free layers
# only. Use `--workspace` explicitly where the network/git deps are available.
default-members = [
    "crates/vault-app",
    "crates/vault-platform",
    "vault-glass",
    "vault-core",
    "vault-md",
    "vault-web",
]