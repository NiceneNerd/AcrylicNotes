[package]
name = "app-windows"
version = "0.1.0"
edition = "2021"
description = "Native WinUI 3 frontend for VaultNotes (windows-reactor). Windows UI; compiles to a compile-time skeleton on non-Windows targets."

[dependencies]
# Platform-neutral shared kernel: commands, effects, view models, repository.
vault-app = { path = "../../crates/vault-app" }
# Shared Markdown IR (Doc/Block/Inline) for the reading renderer.
vault-md = { path = "../../vault-md" }
# Platform service contracts (ExternalOpener, etc.) consumed by the effect runner.
vault-platform = { path = "../../crates/vault-platform" }
# The shared vault-wide search engine (literal ripgrep over .md notes).
vault-core = { path = "../../vault-core" }
# Platform config directory resolution for the settings store (XDG / %APPDATA%).
dirs = "6.0"
# Settings document serialization (the JSON file store).
serde_json = "1"

# windows-reactor (WinUI 3) is pinned to an exact version and only pulled in
# on Windows targets. This crate compiles to a skeleton on Linux/macOS so the
# workspace gates stay green here; native Windows compilation is user-side.
[target.'cfg(target_os = "windows")'.dependencies]
windows-reactor = { version = "=0.100.0" }

# Headless UI testing: windows-reactor's `RecordingRuntime` runs the same
# component code the real WinUI loop runs and records every native command
# for assertions. Test binaries are built for windows-gnu and executed under
# Wine via `cargo run -p xtask -- test-windows-ui` (no Windows machine
# needed); real-Windows verification (rendering, IME, DPI, packaging) stays
# user-side.
[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-reactor = { version = "=0.100.0", features = ["test"] }

[dev-dependencies]
tempfile = "3.22"

[[bin]]
name = "app-windows"
path = "src/main.rs"
