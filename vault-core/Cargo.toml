[package]
name = "vault-core"
version = "0.1.0"
edition = "2021"
description = "UI-free vault: scan, index, resolve, frontmatter, atomic writes"

[dependencies]
notify = { version = "8.2", default-features = true }
notify-debouncer-full = "0.7"
walkdir = "2.5"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "2"
unicode-normalization = "0.1"
hashbrown = "0.14"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.27"
sha2 = "0.10"
# Literal ripgrep as a library (M4 decision 4, shared by GUI + web server):
# ripgrep's own crates.
grep = "0.4"
ignore = "0.4"
regex = "1"