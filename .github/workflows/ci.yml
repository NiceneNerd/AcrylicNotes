name: CI

on:
  push:
    branches: [main, restructure/cross-platform]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace -- -D warnings

  test-linux:
    name: test (Linux, UI-free shared crates + app)
    runs-on: ubuntu-latest
    needs: [clippy]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --no-fail-fast
      - run: cargo test -p app

  test-windows-core:
    name: cross-compile shared crates for x86_64-pc-windows-gnu
    runs-on: ubuntu-latest
    needs: [clippy]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - run: |
          cargo check --tests --target x86_64-pc-windows-gnu \
            -p vault-core -p vault-md -p vault-app -p vault-platform

  check-windows-ui:
    name: cross-compile app-windows UI path for x86_64-pc-windows-gnu
    runs-on: ubuntu-latest
    needs: [clippy]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      # Type-checks the cfg(windows) code (WindowsApp, effect runner, message
      # flow) and the pinned windows-reactor dependency, which no Linux build
      # compiles. Native execution/UI verification stays user-side.
      - run: cargo run -p xtask -- check-windows-ui
      # Lints the same cross target (cfg(windows) code + tests), catching
      # clippy violations the Linux clippy job cannot see.
      - run: cargo clippy --target x86_64-pc-windows-gnu -p app-windows --tests -- -D warnings

  test-windows-ui:
    name: headless WinUI tests under Wine (x86_64-pc-windows-gnu)
    runs-on: ubuntu-latest
    needs: [clippy]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install Wine and the MinGW cross-linker
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine64 g++-mingw-w64-x86-64
      # Runs the cfg(windows) UI tests (windows-reactor RecordingRuntime,
      # feature `test`) headlessly: components run the same code the real
      # WinUI loop runs and assert against the recorded native tree. Wine
      # cannot verify real rendering/IME/DPI — that stays user-side.
      - run: cargo run -p xtask -- test-windows-ui
